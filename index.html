<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vídeo com Pontuação</title>

  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0 0 30px 0;
      background-color: #333;
    }

    #input-container {
      margin: 20px;
    }

    input[type="text"] {
      width: 400px;
      padding: 8px;
      font-size: 16px;
    }

    button {
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    #video-container {
      width: 800px;
      height: 450px;
      border: 10px solid black;
      margin: 20px auto;
      position: relative;
      box-sizing: border-box;
      background: #222;
    }

    #youtube-video {
      width: 100%;
      height: 100%;
      border: 0;
    }

    #counters {
      width: 800px;
      height: 32px;
      margin: 10px auto 0 auto;
      position: relative;
      color: white;
      font-weight: bold;
      line-height: 32px;
    }

    #score-main {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      white-space: nowrap;
    }

    #total-counter {
      position: absolute;
      left: calc(50% + 115px);
      top: 50%;
      transform: translateY(-50%);
      font-size: 27px;
      line-height: 1;
      color: white;
      white-space: nowrap;
    }

    #score-change {
      position: absolute;
      left: calc(50% + 245px);
      top: 50%;
      transform: translateY(-50%);
      min-width: 45px;
      font-size: 18px;
      line-height: 1;
      visibility: hidden;
    }

    #score-change.show {
      visibility: visible;
    }

    #reset-container {
      margin-top: 26px;
    }

    #key-config {
      width: 800px;
      margin: 14px auto 0 auto;
      color: #ddd;
      font-size: 13px;
      line-height: 1.5;
    }

    #key-config-title {
      font-weight: bold;
      color: #fff;
      margin-bottom: 7px;
    }

    #key-config-help {
      color: #cfcfcf;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .config-row {
      display: inline-block;
      margin: 4px 7px;
      white-space: nowrap;
    }

    .key-input {
      width: 72px;
      padding: 4px;
      text-align: center;
      font-size: 14px;
      cursor: pointer;
    }

    #config-warning {
      color: #ffb3b3;
      font-size: 12px;
      margin-top: 6px;
      min-height: 16px;
    }

    #credit {
      width: 800px;
      margin: 24px auto 0 auto;
      color: #aaa;
      font-size: 11px;
    }

    #status {
      color: #fff;
      font-size: 14px;
      margin-top: 8px;
      min-height: 20px;
    }
  </style>
</head>

<body>
  <div id="input-container">
    <input type="text" id="youtube-link" placeholder="YouTube link">
    <button id="load-video">Load Video</button>
    <div id="status"></div>
  </div>

  <div id="video-container">
    <iframe id="youtube-video"
            src="about:blank"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
    </iframe>
  </div>

  <div id="counters">
    <span id="score-main">
      <span id="positive-counter">+0</span>
      <span id="negative-counter">-0</span>
    </span>
    <span id="total-counter">Total: 0</span>
    <span id="score-change"></span>
  </div>

  <div id="reset-container">
    <button id="reset-score">Reset</button>

    <div id="key-config">
      <div id="key-config-title">Configure keys</div>
      <div id="key-config-help">Click a field and press the key you want to use. Letters, numbers, symbols and special keys are accepted.</div>

      <span class="config-row">
        <label for="key-plus-1">+1:</label>
        <input class="key-input" id="key-plus-1" type="text" value="P" data-key="p" data-action="plus1" readonly>
      </span>

      <span class="config-row">
        <label for="key-minus-1">-1:</label>
        <input class="key-input" id="key-minus-1" type="text" value="A" data-key="a" data-action="minus1" readonly>
      </span>

      <span class="config-row">
        <label for="key-plus-2">+2:</label>
        <input class="key-input" id="key-plus-2" type="text" value="L" data-key="l" data-action="plus2" readonly>
      </span>

      <span class="config-row">
        <label for="key-plus-3">+3:</label>
        <input class="key-input" id="key-plus-3" type="text" value="O" data-key="o" data-action="plus3" readonly>
      </span>

      <span class="config-row">
        <label for="key-plus-4">+4:</label>
        <input class="key-input" id="key-plus-4" type="text" value="K" data-key="k" data-action="plus4" readonly>
      </span>

      <span class="config-row">
        <label for="key-plus-0">+0:</label>
        <input class="key-input" id="key-plus-0" type="text" value="Space" data-key=" " data-action="plus0" readonly>
      </span>

      <div id="config-warning"></div>
    </div>
  </div>

  <div id="credit">Developed by Patrick Roncoski</div>

  <script>
    const loadButton = document.getElementById('load-video');
    const youtubeLinkInput = document.getElementById('youtube-link');
    const youtubeIframe = document.getElementById('youtube-video');
    const positiveDisplay = document.getElementById('positive-counter');
    const negativeDisplay = document.getElementById('negative-counter');
    const totalDisplay = document.getElementById('total-counter');
    const resetButton = document.getElementById('reset-score');
    const statusBox = document.getElementById('status');
    const scoreChangeDisplay = document.getElementById('score-change');
    const keyInputs = document.querySelectorAll('.key-input');
    const configWarning = document.getElementById('config-warning');

    let positiveScore = 0;
    let negativeScore = 0;
    let scoreChangeTimeout = null;
    let flashTimeout = null;

    const originalBg = getComputedStyle(document.body).backgroundColor;

    const actionSettings = {
      plus1: {
        value: 1,
        color: '#249c44',
        duration: 250
      },
      minus1: {
        value: -1,
        color: '#bf2011',
        duration: 250
      },
      plus2: {
        value: 2,
        color: '#0d66db',
        duration: 300
      },
      plus3: {
        value: 3,
        color: '#e0a714',
        duration: 350
      },
      plus4: {
        value: 4,
        color: '#ff7a00',
        duration: 400
      },
      plus0: {
        value: 0,
        color: '#A19C9C',
        duration: 250
      }
    };

    function extractVideoID(url) {
      try {
        const parsed = new URL(url);

        if (parsed.hostname.includes('youtu.be')) {
          return parsed.pathname.split('/').filter(Boolean)[0] || '';
        }

        if (parsed.hostname.includes('youtube.com')) {
          if (parsed.pathname === '/watch') {
            return parsed.searchParams.get('v') || '';
          }

          if (parsed.pathname.startsWith('/embed/') || parsed.pathname.startsWith('/shorts/')) {
            return parsed.pathname.split('/').filter(Boolean)[1] || '';
          }
        }
      } catch (e) {
        if (/^[a-zA-Z0-9_-]{11}$/.test(url)) {
          return url;
        }
      }

      return '';
    }

    function buildEmbedUrl(videoId) {
      const params = new URLSearchParams({
        rel: '0',
        playsinline: '1'
      });

      if (location.protocol === 'http:' || location.protocol === 'https:') {
        params.set('origin', location.origin);
      }

      return 'https://www.youtube.com/embed/' + encodeURIComponent(videoId) + '?' + params.toString();
    }

    loadButton.addEventListener('click', function() {
      const url = youtubeLinkInput.value.trim();
      const videoId = extractVideoID(url);

      if (!videoId) {
        alert('Invalid YouTube link or unavailable video.');
        return;
      }

      if (location.protocol === 'file:') {
        statusBox.textContent = 'Warning: open this file through http://localhost or GitHub Pages, not through file://. YouTube may return Error 153 when opened through file://.';
      } else {
        statusBox.textContent = '';
      }

      youtubeIframe.src = buildEmbedUrl(videoId);
    });

    function flashScreen(color, duration) {
      clearTimeout(flashTimeout);

      document.body.style.backgroundColor = color;

      flashTimeout = setTimeout(function() {
        document.body.style.backgroundColor = originalBg;
      }, duration);
    }

    function showScoreChange(value, duration) {
      clearTimeout(scoreChangeTimeout);

      const text = value > 0 ? '+' + value : String(value);
      scoreChangeDisplay.textContent = text;
      scoreChangeDisplay.classList.add('show');

      scoreChangeTimeout = setTimeout(function() {
        scoreChangeDisplay.classList.remove('show');
      }, duration);
    }

    function updateScoreDisplays() {
      positiveDisplay.textContent = '+' + positiveScore;
      negativeDisplay.textContent = '-' + negativeScore;
      totalDisplay.textContent = 'Total: ' + (positiveScore - negativeScore);
    }

    function normalizeKey(key) {
      if (key.length === 1) {
        return key.toLowerCase();
      }

      return key.toLowerCase();
    }

    function formatKeyName(key) {
      const names = {
        ' ': 'Space',
        arrowup: 'Arrow ↑',
        arrowdown: 'Arrow ↓',
        arrowleft: 'Arrow ←',
        arrowright: 'Arrow →',
        escape: 'Esc',
        control: 'Ctrl',
        alt: 'Alt',
        shift: 'Shift',
        meta: 'Meta',
        enter: 'Enter',
        tab: 'Tab',
        backspace: 'Backspace',
        delete: 'Delete'
      };

      if (names[key]) {
        return names[key];
      }

      if (key.length === 1) {
        return key.toUpperCase();
      }

      return key.charAt(0).toUpperCase() + key.slice(1);
    }

    function updateKeyInputDisplay(input) {
      input.value = formatKeyName(input.dataset.key || '');
    }

    function getCurrentKeyConfig() {
      const config = {};

      keyInputs.forEach(function(input) {
        config[input.dataset.action] = input.dataset.key || '';
      });

      return config;
    }

    function validateKeyConfig() {
      const usedKeys = {};
      let hasError = false;
      let warning = '';

      keyInputs.forEach(function(input) {
        input.style.outline = '';
        const key = input.dataset.key || '';

        if (!key) {
          hasError = true;
          input.style.outline = '2px solid #ffb3b3';
          warning = 'Set a key for every action.';
          return;
        }

        if (usedKeys[key]) {
          hasError = true;
          input.style.outline = '2px solid #ffb3b3';
          usedKeys[key].style.outline = '2px solid #ffb3b3';
          warning = 'Do not use the same key for more than one action.';
          return;
        }

        usedKeys[key] = input;
      });

      configWarning.textContent = warning;
      return !hasError;
    }

    keyInputs.forEach(function(input) {
      updateKeyInputDisplay(input);

      input.addEventListener('keydown', function(event) {
        if (event.key === 'Tab') {
          return;
        }

        event.preventDefault();

        if (event.key === 'Dead') {
          return;
        }

        input.dataset.key = normalizeKey(event.key);
        updateKeyInputDisplay(input);
        validateKeyConfig();
        input.blur();
      });

      input.addEventListener('paste', function(event) {
        event.preventDefault();
      });

      input.addEventListener('focus', function() {
        input.select();
      });
    });

    document.addEventListener('keydown', function(event) {
      const activeTag = document.activeElement.tagName.toLowerCase();

      if (activeTag === 'input' || activeTag === 'textarea') {
        return;
      }

      if (!validateKeyConfig()) {
        return;
      }

      const key = normalizeKey(event.key);
      const config = getCurrentKeyConfig();

      for (const action in config) {
        if (config[action] === key) {
          event.preventDefault();

          const setting = actionSettings[action];
          const value = setting.value;

          if (value > 0) {
            positiveScore += value;
          } else if (value < 0) {
            negativeScore += Math.abs(value);
          }

          flashScreen(setting.color, setting.duration);
          updateScoreDisplays();
          showScoreChange(value, setting.duration);
          return;
        }
      }
    });

    resetButton.addEventListener('click', function() {
      positiveScore = 0;
      negativeScore = 0;
      updateScoreDisplays();
      scoreChangeDisplay.textContent = '';
      scoreChangeDisplay.classList.remove('show');
    });

    validateKeyConfig();
    updateScoreDisplays();
  </script>
</body>
</html>
